version: '3.9'

services:
  opencode:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
    ports:
      - "4096:4096"
    volumes:
      - vps-opencode-data:/root/.config/opencode
      - vps-opencode-projects:/workspace
      - vps-opencode-omo:/root/.omo
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1G

volumes:
  vps-opencode-data:
    driver: local
  vps-opencode-projects:
    driver: local
  vps-opencode-omo:
    driver: local